<text x="328" y="807">pad ili commit bez testa</text>
<line x1="510" y1="807" x2="540" y2="807" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="548" y="807">izvještaj</text>
<rect x="40" y="826" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 2"/>
<text x="62" y="833">iscrtkano: isključeno dok nema Playwright suitea</text>
</g>
</svg>
