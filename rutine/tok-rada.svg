<line x1="340" y1="576" x2="340" y2="612"/>
<line x1="440" y1="644" x2="476" y2="644"/>
<line x1="560" y1="672" x2="560" y2="708"/>
<line x1="560" y1="232" x2="560" y2="100"/>
<line x1="560" y1="328" x2="560" y2="292"/>
<path d="M120 480 L120 548 L236 548" stroke-dasharray="4 4"/>
</g>
<path d="M440 452 L460 452 L460 268 L476 268" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#c)"/>
<line x1="440" y1="356" x2="460" y2="356" stroke="#D85A30" stroke-width="1.5"/>

<g font-size="12" fill="#5F5E5A" dominant-baseline="central">
<rect x="40" y="800" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
