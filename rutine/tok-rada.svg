<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Tok rada rutina u Beli</title>
<desc>Sesija ili fixer napravi commit s kodom i testom, pre-commit hook pokrene npm test, commit ide na development. E2E noćna pokrene unit, db i Playwright testove, release review provjeri da svaka promjena ima test, kroničar ujutro pošalje jednu poruku, a ti odobriš deploy na master. Sync nosi Belin master u Tresetu. Izviđači, padovi testova i commitovi bez testa otvaraju issue koje uzima fixer.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="860" rx="12" fill="#FAFAF8"/>

<g font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="40" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="120" y="60" fill="#3C3489">Sesija</text>
<rect x="240" y="40" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="60" fill="#2C2C2A">Commit</text>
<rect x="480" y="40" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="560" y="60" fill="#3C3489">Fixer</text>

<rect x="240" y="136" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="156" fill="#085041">Pre-commit hook</text>

<rect x="240" y="232" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="252" fill="#2C2C2A">development</text>
<rect x="480" y="232" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="560" y="252" fill="#2C2C2A">GitHub issuei</text>

<rect x="240" y="328" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
<text x="340" y="348" fill="#085041">E2E noćna</text>
<rect x="480" y="328" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="560" y="348" fill="#2C2C2A">Izviđači</text>

<rect x="40" y="424" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="120" y="444" fill="#2C2C2A">Izvještaji rutina</text>
<rect x="240" y="424" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="444" fill="#085041">Release review</text>

<rect x="240" y="520" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="540" fill="#2C2C2A">Kroničar · 06:45</text>

<rect x="240" y="616" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="636" fill="#2C2C2A">Ti</text>
<rect x="480" y="616" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="560" y="636" fill="#2C2C2A">master</text>

<rect x="480" y="712" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="560" y="732" fill="#2C2C2A">Sync · 05:00</text>
</g>

<g font-size="12" text-anchor="middle" dominant-baseline="central">
<text x="120" y="78" fill="#534AB7">zadatak od tebe</text>
<text x="340" y="78" fill="#5F5E5A">kod + test: unit, db, E2E</text>
<text x="560" y="78" fill="#534AB7">00:00 i 12:00</text>
<text x="340" y="174" fill="#0F6E56">npm test mora proći</text>
<text x="340" y="270" fill="#5F5E5A">novi SHA</text>
<text x="560" y="270" fill="#5F5E5A">red posla</text>
<text x="340" y="366" fill="#0F6E56">unit, db, Playwright</text>
<text x="560" y="366" fill="#5F5E5A">scan, UX patrola</text>
<text x="120" y="462" fill="#5F5E5A">jedan oblik za sve</text>
<text x="340" y="462" fill="#0F6E56">ima li svaka promjena test</text>
<text x="340" y="558" fill="#5F5E5A">jedna jutarnja poruka</text>
<text x="340" y="654" fill="#5F5E5A">odobriš deploy</text>
<text x="560" y="654" fill="#5F5E5A">produkcija</text>
<text x="560" y="750" fill="#5F5E5A">Belin master → Treseta</text>
</g>

